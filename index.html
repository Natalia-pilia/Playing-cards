<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cards">
        <div class="card">
            <div class="card_type">
                <img src="J.svg">
                <img src="Corner Suits.svg">
            </div>
            <img class="image" src="JD.png" alt="jack">
            <div class="card_type_reverse">
                <img src="J.svg">
                <img src="Corner Suits.svg">
            </div>
        </div>

        <div class="card">
            <div class="card_type">
                <img src="Q.svg">
                <img src="Corner Suits.svg">
            </div>
            <img class="image" src="QD.png" alt="queen">
            <div class="card_type_reverse">
                <img src="Q.svg">
                <img src="Corner Suits.svg">
            </div>
        </div>

        <div class="card">
            <div class="card_type">
                <img src="K.svg">
                <img src="Corner Suits.svg">
            </div>
            <img class="image" src="KD.png" alt="jack">
            <div class="card_type_reverse">
                <img src="K.svg">
                <img src="Corner Suits.svg">
            </div>
        </div>
    </div>
    
</body>
</html>
